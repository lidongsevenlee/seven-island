<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Seven Island 是一款开源 macOS 刘海应用，支持音乐控制、剪贴板历史、VS Code 项目与备忘录。">
  <meta name="theme-color" content="#fbfbfb">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Seven Island">
  <meta property="og:description" content="Seven Island 的原生界面操作录屏与 macOS 下载。">
  <meta property="og:url" content="https://lidongsevenlee.github.io/seven-island/">
  <meta property="og:image" content="https://lidongsevenlee.github.io/seven-island/assets/seven-island-music-showcase.jpg">
  <link rel="icon" href="assets/icon.png">
  <link rel="preload" href="assets/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=showcase">
  <script src="demo.js?v=showcase" defer></script>
  <title>Seven Island</title>
</head>
<body>
  <main id="main">
    <figure id="demo" aria-labelledby="product-name">
      <div class="hero">
        <img class="wallpaper" src="assets/showcase-2560.jpg" srcset="assets/showcase-1280.jpg 1280w, assets/showcase-2560.jpg 2560w" sizes="100vw" alt="" fetchpriority="high">
        <div class="hero-content">
          <h1 class="product-notch" id="product-name"><img src="assets/icon.png" width="24" height="24" alt="Seven Island"></h1>
          <a class="download-link" href="https://github.com/lidongsevenlee/seven-island/releases/latest" aria-label="macOS 下载与源码，适用于 macOS 14 及以上">
            <img src="assets/apple.svg" width="16" height="16" alt="">macOS 下载与源码
          </a>
          <div class="capture-frame">
            <div class="capture-viewport">
              <div id="panel-music" role="tabpanel" aria-labelledby="tab-music" tabindex="0">
                <video muted playsinline preload="none" poster="assets/seven-island-music-showcase.jpg" data-src="assets/seven-island-music-showcase.mp4" aria-label="音乐录屏。将鼠标移到刘海展开播放器，查看同步歌词和频谱，暂停与恢复播放。"></video>
              </div>
              <div id="panel-clipboard" role="tabpanel" aria-labelledby="tab-clipboard" tabindex="0" hidden>
                <video muted playsinline preload="none" poster="assets/seven-island-clipboard-showcase.jpg" data-src="assets/seven-island-clipboard-showcase.mp4" aria-label="剪贴板录屏。搜索设计，重新复制已存在的记录并将它移到顶部。"></video>
              </div>
              <div id="panel-vscode" role="tabpanel" aria-labelledby="tab-vscode" tabindex="0" hidden>
                <video muted playsinline preload="none" poster="assets/seven-island-vscode-showcase.jpg" data-src="assets/seven-island-vscode-showcase.mp4" aria-label="VS Code 录屏。输入 Orbit，定位 OrbitApp 项目。"></video>
              </div>
              <div id="panel-memo" role="tabpanel" aria-labelledby="tab-memo" tabindex="0" hidden>
                <video muted playsinline preload="none" poster="assets/seven-island-memo-showcase.jpg" data-src="assets/seven-island-memo-showcase.mp4" aria-label="备忘录录屏。切换到本周计划，编辑内容，再新建备忘录。"></video>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="demo-controls">
        <div class="capture-tabs" role="tablist" aria-label="切换录屏场景">
          <button id="tab-music" type="button" role="tab" aria-selected="true" aria-controls="panel-music">音乐</button>
          <button id="tab-clipboard" type="button" role="tab" aria-selected="false" aria-controls="panel-clipboard" tabindex="-1">剪贴板</button>
          <button id="tab-vscode" type="button" role="tab" aria-selected="false" aria-controls="panel-vscode" tabindex="-1">VS Code</button>
          <button id="tab-memo" type="button" role="tab" aria-selected="false" aria-controls="panel-memo" tabindex="-1">备忘录</button>
        </div>
        <button id="motion-toggle" class="motion-toggle" type="button" aria-label="播放录屏" title="播放录屏">
          <span id="motion-icon" aria-hidden="true">▶</span>
        </button>
      </div>
      <figcaption class="sr-only">当前开发版的原生界面录屏，使用示例数据。</figcaption>
      <p id="demo-error" class="demo-error" role="status" hidden>录屏加载失败。可以切换到其他场景。</p>
    </figure>
  </main>
</body>
</html>
