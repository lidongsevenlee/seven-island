name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g., v2.8.0). The tag must already exist.'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GIT_USER: "github-actions[bot]"
  GIT_EMAIL: "github-actions[bot]@users.noreply.github.com"

jobs:
  release:
    name: Build & Release
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Tag Ref
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=refs/tags/${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build App
        run: |
          xcodebuild \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            build

      - name: Read Version
        id: version
        run: |
          INFO_PLIST="build/DerivedData/Build/Products/Release/Seven Island.app/Contents/Info.plist"
          VERSION=$(defaults read "$(pwd)/$INFO_PLIST" CFBundleShortVersionString 2>/dev/null || echo "${{ steps.tag.outputs.tag }}" | sed 's/^v//')
          BUILD=$(defaults read "$(pwd)/$INFO_PLIST" CFBundleVersion 2>/dev/null || echo "0")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        run: |
          python3 -m venv build/dmg-venv
          source build/dmg-venv/bin/activate
          pip install -q dmgbuild ds-store mac-alias
          mkdir -p build/dist
          DMG_PATH="build/dist/Seven-Island-${{ steps.version.outputs.version }}.dmg"
          bash Configuration/dmg/create_dmg.sh \
            "build/DerivedData/Build/Products/Release/Seven Island.app" \
            "$DMG_PATH" \
            "Seven Island ${{ steps.version.outputs.version }}"

      - name: Check Sparkle Signing Key
        id: check-key
        run: |
          if [ -n "$SPARKLE_PRIVATE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Warning: SPARKLE_PRIVATE_KEY not set, skipping Sparkle signing" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

      - name: Create GitHub Release with DMG
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/*.dmg
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: false

      - name: Sparkle Sign DMG & Update Appcast
        if: steps.check-key.outputs.available == 'true'
        run: |
          python3 -m venv build/sign-venv
          source build/sign-venv/bin/activate
          pip install -q cryptography
          python3 .github/workflows/scripts/update-appcast.py \
            "updater/appcast.xml" \
            "build/dist/Seven-Island-${{ steps.version.outputs.version }}.dmg" \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.build }}" \
            "${{ steps.tag.outputs.tag }}" \
            "${{ github.repository }}"
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

      - name: Commit Updated Appcast
        if: steps.check-key.outputs.available == 'true'
        run: |
          git fetch origin main
          # Branch from origin/main — not from the tag — so the commit lands
          # cleanly on top of whatever previous release cycles may have appended.
          git checkout -B appcast-update origin/main
          # Re-run the signing script against origin/main's appcast so all
          # prior entries are preserved (stash-pop was conflict-prone when a
          # previous release had already appended entries not present locally).
          python3 -m venv build/sign-venv
          source build/sign-venv/bin/activate
          pip install -q cryptography
          python3 .github/workflows/scripts/update-appcast.py \
            "updater/appcast.xml" \
            "build/dist/Seven-Island-${{ steps.version.outputs.version }}.dmg" \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.build }}" \
            "${{ steps.tag.outputs.tag }}" \
            "${{ github.repository }}"
          git config user.name "$GIT_USER"
          git config user.email "$GIT_EMAIL"
          git add updater/appcast.xml
          git commit -m "Update appcast for ${{ steps.tag.outputs.tag }}" || echo "No changes to commit"
          git push origin appcast-update:main
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
