name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g., v2.8.0). The tag must already exist.'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  GIT_USER: "github-actions[bot]"
  GIT_EMAIL: "github-actions[bot]@users.noreply.github.com"

jobs:
  release:
    name: Build & Release
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout Release Workflow
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0

      - name: Find Published DMG
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null
          DMG_NAME=$(python3 .github/workflows/scripts/find-release-dmg.py)
          echo "name=$DMG_NAME" >> "$GITHUB_OUTPUT"

      - name: Build Release Tag
        if: steps.asset.outputs.name == ''
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          mkdir -p build/dist
          git worktree add --detach build/release-source "refs/tags/$RELEASE_TAG"
          cd build/release-source
          bash "$GITHUB_WORKSPACE/.github/workflows/scripts/build-release.sh"

      - name: Package Release DMG
        id: build
        if: steps.asset.outputs.name == ''
        run: |
          cd build/release-source
          APP_PATH="build/DerivedData/Build/Products/Release/Seven Island.app"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")
          DMG_NAME="Seven-Island-$VERSION.dmg"
          python3 -m venv "$GITHUB_WORKSPACE/build/dmg-venv"
          source "$GITHUB_WORKSPACE/build/dmg-venv/bin/activate"
          pip install -q dmgbuild ds-store mac-alias
          bash Configuration/dmg/create_dmg.sh \
            "$APP_PATH" "$GITHUB_WORKSPACE/build/dist/$DMG_NAME" "Seven Island $VERSION"
          echo "name=$DMG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with DMG
        if: steps.asset.outputs.name == ''
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/${{ steps.build.outputs.name }}
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false

      - name: Check Sparkle Signing Key
        id: check-key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -n "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Appcast requires SPARKLE_PRIVATE_KEY." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download Published DMG
        if: steps.check-key.outputs.available == 'true'
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          DMG_NAME: ${{ steps.asset.outputs.name || steps.build.outputs.name }}
        run: |
          mkdir -p build/published
          DMG_PATH="$GITHUB_WORKSPACE/build/published/$DMG_NAME"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "$DMG_NAME" --output "$DMG_PATH" -- "$RELEASE_TAG"
          test -s "$DMG_PATH"
          echo "path=$DMG_PATH" >> "$GITHUB_OUTPUT"

      - name: Read Version from Published DMG
        if: steps.check-key.outputs.available == 'true'
        id: version
        env:
          DMG_PATH: ${{ steps.download.outputs.path }}
        run: |
          MOUNT_POINT=$(mktemp -d "$RUNNER_TEMP/seven-island-dmg.XXXXXXXX")
          mounted=false
          cleanup() {
            if [[ "$mounted" == true ]]; then
              hdiutil detach "$MOUNT_POINT" >/dev/null
            fi
            rmdir "$MOUNT_POINT"
          }
          trap cleanup EXIT

          hdiutil attach "$DMG_PATH" -readonly -nobrowse -noautoopen -mountpoint "$MOUNT_POINT" >/dev/null
          mounted=true
          INFO_PLIST="$MOUNT_POINT/Seven Island.app/Contents/Info.plist"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")
          if [[ "${DMG_PATH##*/}" != "Seven-Island-$VERSION.dmg" || -z "$BUILD" ]]; then
            echo "Published DMG and application version metadata must match." >&2
            exit 1
          fi
          printf 'version=%s\nbuild=%s\n' "$VERSION" "$BUILD" >> "$GITHUB_OUTPUT"

      - name: Commit Updated Appcast
        if: steps.check-key.outputs.available == 'true'
        env:
          DMG_PATH: ${{ steps.download.outputs.path }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 -m venv build/sign-venv
          source build/sign-venv/bin/activate
          pip install -q cryptography
          bash .github/workflows/scripts/publish-appcast.sh \
            "$DMG_PATH" "$VERSION" "$BUILD" "$RELEASE_TAG" "$GITHUB_REPOSITORY"
